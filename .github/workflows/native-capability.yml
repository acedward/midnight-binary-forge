name: Native runner capability drift

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 2'

permissions:
  contents: read

jobs:
  native-capability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15
            os: macos
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prove native runner identity and minimum capability
        run: python3 scripts/check_runner_capability.py --runner-label '${{ matrix.runner }}' --expected-os '${{ matrix.os }}' --expected-arch '${{ matrix.arch }}' --require-tool git --min-free-gib 2
