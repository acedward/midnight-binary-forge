name: Reusable verified mirror boundary

on:
  workflow_call:
    inputs:
      component-path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verified-mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate committed mirror contract
        env:
          COMPONENT_PATH: ${{ inputs.component-path }}
        run: |
          case "$COMPONENT_PATH" in catalog/components/*.json) ;; *) exit 2 ;; esac
          python3 -m pip install --requirement requirements-ci.txt
          python3 scripts/validate_catalog.py component "$COMPONENT_PATH"
          echo 'Verified fetch/repack execution is added by the owning component phase.'
