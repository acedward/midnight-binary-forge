name: Immutable forge candidate

on:
  workflow_dispatch:
    inputs:
      build-set-id:
        description: Committed catalog/buildsets ID (no path or URL)
        required: true
        type: string
      build-set-sha256:
        description: Exact SHA-256 of the committed build-set JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: forge-candidate-publication
  cancel-in-progress: false

jobs:
  validate-protected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      build-set-path: ${{ steps.validate.outputs.build-set-path }}
    steps:
      - name: Check out exact protected-main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact committed build set and source ancestry
        id: validate
        env:
          BUILD_SET_ID: ${{ inputs.build-set-id }}
          BUILD_SET_SHA256: ${{ inputs.build-set-sha256 }}
        run: |
          set -euo pipefail
          case "$BUILD_SET_ID" in ''|*[!a-z0-9._-]*) exit 2 ;; esac
          case "$BUILD_SET_SHA256" in *[!0-9a-f]*|'') exit 2 ;; esac
          test "${#BUILD_SET_SHA256}" -eq 64
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          BUILD_SET_PATH="catalog/buildsets/${BUILD_SET_ID}.json"
          test -f "$BUILD_SET_PATH"
          test "$(sha256sum "$BUILD_SET_PATH" | cut -d' ' -f1)" = "$BUILD_SET_SHA256"
          python3 -m pip install --requirement requirements-ci.txt
          python3 scripts/phase6_candidate.py validate-buildset --build-set "$BUILD_SET_PATH" --require-git-ancestry
          python3 scripts/github_phase6.py verify-source --expected-sha "$GITHUB_SHA" --output protected-source.json
          printf 'build-set-path=%s\n' "$BUILD_SET_PATH" >> "$GITHUB_OUTPUT"
      - name: Retain protected-source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-protected-source-${{ github.sha }}
          path: protected-source.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  assemble-verified-content:
    needs: validate-protected-source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      staging-artifact-id: ${{ steps.stage.outputs.artifact-id }}
      staging-name: ${{ steps.assemble.outputs.staging-name }}
      content-list-digest: ${{ steps.assemble.outputs.content-list-digest }}
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install verifier dependencies
        run: python3 -m pip install --requirement requirements-ci.txt
      - name: Capture and verify live audited-input metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/github_phase6.py capture-inputs --build-set "${{ needs.validate-protected-source.outputs.build-set-path }}" --output input-live-metadata.json
          python3 scripts/phase6_candidate.py verify-live-inputs --build-set "${{ needs.validate-protected-source.outputs.build-set-path }}" --metadata input-live-metadata.json
      - name: Download exact Phase-3p proof-data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: 33170546601
          artifact-ids: 9685464135
          merge-multiple: true
          path: input-artifacts/phase3p-proof-data
      - name: Download exact Phase-4 Celestia appd artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: 33177534764
          artifact-ids: 9688244894
          merge-multiple: true
          path: input-artifacts/phase4-celestia-appd-linux-arm64
      - name: Download exact Phase-4 Celestia node artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: 33177534764
          artifact-ids: 9688243729
          merge-multiple: true
          path: input-artifacts/phase4-celestia-node-linux-arm64
      - name: Download exact Phase-4 Midnight node artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: 33177534764
          artifact-ids: 9688330126
          merge-multiple: true
          path: input-artifacts/phase4-node-linux-arm64
      - name: Download exact Phase-4 toolkit Linux amd64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: 33177534764
          artifact-ids: 9688263793
          merge-multiple: true
          path: input-artifacts/phase4-toolkit-linux-amd64
      - name: Download exact Phase-4 toolkit Linux arm64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: 33177534764
          artifact-ids: 9688255774
          merge-multiple: true
          path: input-artifacts/phase4-toolkit-linux-arm64
      - name: Download exact Phase-4 toolkit macOS arm64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: 33177534764
          artifact-ids: 9689647047
          merge-multiple: true
          path: input-artifacts/phase4-toolkit-macos-arm64
      - name: Download exact Phase-5 verified indexer aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: 33176004154
          artifact-ids: 9690093579
          merge-multiple: true
          path: input-artifacts/phase5-indexer
      - name: Assemble and non-executingly verify exact 31-payload content
        id: assemble
        env:
          BUILD_SET_PATH: ${{ needs.validate-protected-source.outputs.build-set-path }}
        run: |
          set -euo pipefail
          python3 scripts/phase6_candidate.py assemble --build-set "$BUILD_SET_PATH" --input-root input-artifacts --output verified-content --result-output candidate-verification.json
          python3 scripts/phase6_candidate.py verify --build-set "$BUILD_SET_PATH" --content verified-content
          CONTENT_LIST_DIGEST="$(jq -r '.contentAssetListSha256' candidate-verification.json)"
          test "$(printf '%s' "$CONTENT_LIST_DIGEST" | wc -c)" -eq 64
          STAGING_NAME="verified-content-${{ inputs.build-set-id }}-${CONTENT_LIST_DIGEST}"
          printf 'content-list-digest=%s\n' "$CONTENT_LIST_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'staging-name=%s\n' "$STAGING_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact immutable staging content
        id: stage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.assemble.outputs.staging-name }}
          path: verified-content/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
      - name: Capture exact staging artifact identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github_phase6.py capture-staging --artifact-id "${{ steps.stage.outputs.artifact-id }}" --expected-name "${{ steps.assemble.outputs.staging-name }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output staging.json
      - name: Retain verified input and staging metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-assembly-evidence-${{ github.sha }}
          path: |
            candidate-verification.json
            input-live-metadata.json
            staging.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  create-protected-draft:
    needs: [validate-protected-source, assemble-verified-content]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: candidate-publish
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download protected-source evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: ${{ github.run_id }}
          name: phase6-protected-source-${{ github.sha }}
          path: protected-source
      - name: Allocate API-time unique empty draft and read it back
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github_phase6.py allocate-draft --expected-sha "$GITHUB_SHA" --source protected-source/protected-source.json --output draft.json
      - name: Retain exact draft identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-draft-${{ github.sha }}
          path: draft.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  fresh-final-claims-verifier:
    needs: [validate-protected-source, assemble-verified-content, create-protected-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      claims-digest: ${{ steps.verify.outputs.claims-digest }}
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install verifier dependencies
        run: python3 -m pip install --requirement requirements-ci.txt
      - name: Redownload exact staging by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.assemble-verified-content.outputs.staging-artifact-id }}
          merge-multiple: true
          path: verified-content
      - name: Download assembly, draft, and protected-source evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: ${{ github.run_id }}
          pattern: phase6-*-${{ github.sha }}
          path: handoff
          merge-multiple: true
      - name: Reverify content and create canonical draft-bound claims
        id: verify
        env:
          BUILD_SET_PATH: ${{ needs.validate-protected-source.outputs.build-set-path }}
        run: |
          set -euo pipefail
          python3 scripts/phase6_candidate.py verify --build-set "$BUILD_SET_PATH" --content verified-content
          WORKFLOW_SHA="$(jq -r '.workflowSha' handoff/protected-source.json)"
          python3 scripts/phase6_candidate.py make-claims --build-set "$BUILD_SET_PATH" --content verified-content --draft handoff/draft.json --staging handoff/staging.json --commit-sha "$GITHUB_SHA" --workflow-sha "$WORKFLOW_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output "promotion-claims-${{ inputs.build-set-id }}.json"
          python3 scripts/publisher_guard.py verify-claims-content --claims "promotion-claims-${{ inputs.build-set-id }}.json" --content-dir verified-content --require-context
          printf 'claims-digest=sha256:%s\n' "$(python3 scripts/canonical_json.py sha256 "promotion-claims-${{ inputs.build-set-id }}.json")" >> "$GITHUB_OUTPUT"
      - name: Retain canonical claims
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6-claims-${{ github.sha }}
          path: promotion-claims-${{ inputs.build-set-id }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

  protected-publisher:
    needs: [validate-protected-source, assemble-verified-content, create-protected-draft, fresh-final-claims-verifier]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: candidate-publish
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Redownload exact staging by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.assemble-verified-content.outputs.staging-artifact-id }}
          merge-multiple: true
          path: verified-content
      - name: Download exact claims and draft handoffs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: acedward/midnight-binary-forge
          run-id: ${{ github.run_id }}
          pattern: phase6-*-${{ github.sha }}
          path: handoff
          merge-multiple: true
      - name: Recheck inert claims/content before attestation
        run: python3 scripts/publisher_guard.py verify-claims-content --claims "handoff/promotion-claims-${{ inputs.build-set-id }}.json" --content-dir verified-content --require-context
      - name: Attest exact canonical claims predicate
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: promotion-claims-${{ inputs.build-set-id }}
          subject-digest: ${{ needs.fresh-final-claims-verifier.outputs.claims-digest }}
          predicate-type: https://github.com/acedward/midnight-binary-forge/predicates/promotion-envelope/v1
          predicate-path: handoff/promotion-claims-${{ inputs.build-set-id }}.json
          show-summary: false
      - name: Cryptographically verify bundle and materialize frozen envelope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEST_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$ATTEST_BUNDLE_PATH" "attestation-${{ inputs.build-set-id }}.sigstore.json"
          gh attestation verify "handoff/promotion-claims-${{ inputs.build-set-id }}.json" --repo "$GITHUB_REPOSITORY" --bundle "attestation-${{ inputs.build-set-id }}.sigstore.json" --predicate-type 'https://github.com/acedward/midnight-binary-forge/predicates/promotion-envelope/v1'
          python3 scripts/materialize_envelope.py --claims "handoff/promotion-claims-${{ inputs.build-set-id }}.json" --bundle "attestation-${{ inputs.build-set-id }}.sigstore.json" --output "promotion-envelope-${{ inputs.build-set-id }}.json"
          python3 scripts/publisher_guard.py verify-transport --envelope "promotion-envelope-${{ inputs.build-set-id }}.json" --bundle "attestation-${{ inputs.build-set-id }}.sigstore.json" --content-dir verified-content --require-context
      - name: Upload/read back, publish immutable, and prove mutation rejection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github_phase6.py publish --claims "handoff/promotion-claims-${{ inputs.build-set-id }}.json" --content verified-content --bundle "attestation-${{ inputs.build-set-id }}.sigstore.json" --envelope "promotion-envelope-${{ inputs.build-set-id }}.json" --draft handoff/draft.json --output published.json
      - name: Retain post-publication handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-candidate-${{ inputs.build-set-id }}
          path: published.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
