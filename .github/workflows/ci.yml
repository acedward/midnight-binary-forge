name: Forge policy CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned validation dependencies
        run: python3 -m pip install --requirement requirements-ci.txt
      - name: Validate catalog
        run: python3 scripts/validate_catalog.py all --root .
      - name: Enforce workflow policy
        run: python3 scripts/check_workflow_policy.py
      - name: Run Phase 1 test suite
        run: python3 -m unittest discover -v tests
